name: Deploy to DigitalOcean

# Runs alongside the AWS workflow (deploy.yml), which is left unchanged.
# Runs on every push to the digitalocean-deploy branch, or by hand from the Actions tab
# (the Run workflow button appears once this file is on the default branch).
# Server setup this relies on: docs/deploy-nuxt-digitalocean.md
#
# Secrets used:
#   SSH_HOST, SSH_USER, SSH_PASSWORD  login for the droplet (user "deploy")
#   ENV_FILE                          the whole .env file. Used for the build, and written to
#                                     $APP_DIR/shared/.env on the server on every deploy.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-digitalocean-gcc-website
  cancel-in-progress: false

env:
  APP_DIR: /var/www/apps/gcc-website   # releases/, shared/ and the "current" symlink live here
  APP_PORT: 3001                       # Nuxt listens on 127.0.0.1:3001, nginx proxies to it
  KEEP_RELEASES: 3                     # each release is about 300 MB, so keep only 3

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      ######################################################
      # Checkout Repository (uses the built-in GITHUB_TOKEN)
      ######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################
      # Setup Node.js (the server must run the same major version)
      ######################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      ######################################################
      # Write .env from the ENV_FILE secret
      # nuxt.config.ts reads some values at build time (payment gateway, amounts)
      ######################################################
      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -e
          [ -n "$ENV_FILE" ] || { echo "ERROR: the ENV_FILE secret is empty or missing"; exit 1; }
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          ENV_B64="$(base64 -w0 .env)"
          echo "::add-mask::$ENV_B64"
          echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"

      ######################################################
      # Install and Build (package-lock.json is not in git, so npm install)
      # Output: dist/server (Node server with its own node_modules) and dist/public
      ######################################################
      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Nuxt Application
        run: npm run build

      ######################################################
      # Package: dist/ only (.env is not included)
      ######################################################
      - name: Package Build
        run: |
          set -e
          test -f dist/server/index.mjs || { echo "ERROR: dist/server/index.mjs missing after build"; exit 1; }
          RELEASE="$(date +%Y%m%d_%H%M%S)"
          ARCHIVE="release_${RELEASE}.tar.gz"
          tar -czf "$ARCHIVE" dist
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      ######################################################
      # Upload Package to the Droplet
      ######################################################
      - name: Copy Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ env.ARCHIVE }}
          target: ${{ env.APP_DIR }}/uploads
          timeout: 120s
          command_timeout: 20m

      ######################################################
      # Write .env, unpack, switch, restart, check
      ######################################################
      - name: Activate Release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_DIR,APP_PORT,RELEASE,ARCHIVE,KEEP_RELEASES,ENV_B64
          command_timeout: 15m
          script: |
            set -e
            TARGET="$APP_DIR/releases/$RELEASE"

            echo "Writing $APP_DIR/shared/.env"
            mkdir -p "$APP_DIR/shared"
            ( umask 077; printf '%s' "$ENV_B64" | base64 -d > "$APP_DIR/shared/.env.tmp" )
            mv -f "$APP_DIR/shared/.env.tmp" "$APP_DIR/shared/.env"

            echo "Unpacking release $RELEASE"
            mkdir -p "$TARGET"
            tar -xzf "$APP_DIR/uploads/$ARCHIVE" -C "$TARGET"
            rm -f "$APP_DIR/uploads/$ARCHIVE"

            test -f "$TARGET/dist/server/index.mjs" || { echo "ERROR: dist/server/index.mjs missing in release"; exit 1; }

            # Switch to the new release in one step
            ln -sfn "$TARGET" "$APP_DIR/current.tmp"
            mv -Tf "$APP_DIR/current.tmp" "$APP_DIR/current"

            echo "Restarting the site"
            sudo -n /usr/bin/systemctl restart gcc-website

            # Wait up to 60 seconds for Nuxt to answer
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null "http://127.0.0.1:$APP_PORT/" && break
              sleep 2
            done
            curl -fsS -o /dev/null "http://127.0.0.1:$APP_PORT/" || { echo "ERROR: site is not answering on port $APP_PORT"; exit 1; }

            # Keep only the newest releases
            cd "$APP_DIR/releases"
            ls -1t | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf

            echo "Live: $(readlink -f "$APP_DIR/current")"
