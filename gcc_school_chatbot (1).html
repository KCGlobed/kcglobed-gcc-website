<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GCC School — Aria Chatbot</title>
<style>
:root {
  --p50:#EEEDFE; --p100:#CECBF6; --p400:#7F77DD;
  --p600:#534AB7; --p800:#3C3489; --p900:#26215C;
  --g50:#EAF3DE; --g600:#3B6D11;
  --c50:#FAECE7; --c600:#993C1D; --c300:#f0997b;
  --gray100:#D3D1C7; --gray400:#888780;
  --txt:#1a1a1a; --txt2:#6b6b6b; --txt3:#9a9a9a;
  --bg:#f5f4f2; --card:#ffffff;
  --bdr:rgba(0,0,0,0.1); --bdr2:rgba(0,0,0,0.18);
  --rmd:10px; --rlg:16px; --rxl:24px;
  --sh:0 8px 32px rgba(0,0,0,0.14),0 0 0 0.5px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.demo-bg{position:fixed;inset:0;background:var(--bg);z-index:0;display:flex;align-items:center;justify-content:center;}
.demo-label{text-align:center;user-select:none;}
.demo-label h1{font-size:28px;font-weight:700;color:var(--p900);margin-bottom:6px;}
.demo-label p{font-size:13px;color:var(--txt3);}

/* WIDGET */
.cw{position:fixed;bottom:24px;right:24px;width:390px;max-height:640px;background:var(--card);border-radius:var(--rxl);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;z-index:1000;border:0.5px solid var(--bdr);transition:opacity .25s,transform .25s;transform-origin:bottom right;}
.cw.hide{opacity:0;transform:scale(0.88) translateY(12px);pointer-events:none;}

/* HEADER */
.ch{background:var(--p900);padding:13px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.ch-ava{width:36px;height:36px;border-radius:50%;background:var(--p600);border:2px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ch-ava svg{width:18px;height:18px;fill:#fff;}
.ch-info{flex:1;}
.ch-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.01em;}
.ch-status{font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:5px;margin-top:1px;}
.ch-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;}
.ch-close{background:rgba(255,255,255,.1);border:none;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.7);font-size:18px;line-height:1;transition:background .15s;}
.ch-close:hover{background:rgba(255,255,255,.2);}

/* PROGRESS */
.cp{padding:8px 16px 7px;background:var(--p900);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.cp-labels{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.45);margin-bottom:5px;}
.cp-pct{color:rgba(255,255,255,.85);font-weight:600;}
.cp-track{height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;}
.cp-fill{height:100%;background:linear-gradient(90deg,var(--p400),#a78bfa);border-radius:4px;transition:width .6s ease;width:13%;}

/* BODY */
.cb{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:7px;background:#f8f7f6;scroll-behavior:smooth;}
.cb::-webkit-scrollbar{width:3px;}
.cb::-webkit-scrollbar-thumb{background:var(--gray100);border-radius:3px;}

/* MESSAGES */
.mr{display:flex;gap:7px;align-items:flex-end;}
.mr.u{justify-content:flex-end;}
.mava{width:26px;height:26px;border-radius:50%;background:var(--p600);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:2px;}
.mava svg{width:13px;height:13px;fill:#fff;}
.mava.err{background:#993C1D;}
.bub{max-width:265px;padding:9px 12px;font-size:13.5px;line-height:1.55;word-break:break-word;}
.bub.bot{background:var(--card);color:var(--txt);border-radius:16px 16px 16px 4px;border:0.5px solid var(--bdr);}
.bub.usr{background:var(--p600);color:#fff;border-radius:16px 16px 4px 16px;}
.bub.err{background:var(--c50);color:var(--c600);border-radius:16px 16px 16px 4px;border:0.5px solid var(--c300);}

/* TYPING */
.typing-row{display:flex;gap:7px;align-items:flex-end;}
.typing-bub{background:var(--card);border:0.5px solid var(--bdr);border-radius:16px 16px 16px 4px;padding:10px 14px;display:flex;gap:4px;align-items:center;}
.td{width:6px;height:6px;border-radius:50%;background:var(--gray400);animation:tdp 1.1s infinite;}
.td:nth-child(2){animation-delay:.15s;}
.td:nth-child(3){animation-delay:.3s;}
@keyframes tdp{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}

/* DIVIDER */
.sdiv{display:flex;align-items:center;gap:7px;margin:4px 0;}
.sdiv-line{flex:1;height:.5px;background:var(--bdr);}
.sdiv-label{font-size:10px;color:var(--txt3);white-space:nowrap;font-weight:500;text-transform:uppercase;letter-spacing:.5px;}

/* QUICK REPLIES */
.qr-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:1px 0 3px 33px;}
.qr-btn{font-size:12.5px;padding:7px 13px;border-radius:20px;border:1.5px solid var(--p600);color:var(--p600);background:#fff;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500;}
.qr-btn:hover{background:var(--p50);}
.qr-btn.sel{background:var(--p600);color:#fff;pointer-events:none;border-color:var(--p600);}
.qr-btn:disabled{opacity:.5;cursor:default;}

/* UPLOAD */
.up-wrap{padding:2px 0 3px 33px;}
.up-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--rmd);border:1.5px dashed var(--p400);color:var(--p800);background:var(--p50);cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:500;transition:all .15s;}
.up-btn:hover{background:var(--p100);border-color:var(--p600);}
.up-btn:disabled{opacity:.45;cursor:default;}
.up-btn svg{width:16px;height:16px;flex-shrink:0;}
.up-inp{display:none;}

/* INPUT BAR */
.ci{padding:10px 12px;border-top:.5px solid var(--bdr);display:flex;gap:8px;align-items:center;background:var(--card);flex-shrink:0;}
.ci-txt{flex:1;padding:9px 13px;border:.5px solid var(--bdr2);border-radius:20px;font-size:13px;color:var(--txt);background:#fafafa;font-family:inherit;outline:none;transition:border-color .15s;}
.ci-txt:focus{border-color:var(--p600);background:#fff;}
.ci-txt:disabled{opacity:.4;cursor:not-allowed;}
.ci-send{width:34px;height:34px;border-radius:50%;background:var(--p600);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s;}
.ci-send:hover{background:var(--p800);}
.ci-send:active{transform:scale(.92);}
.ci-send:disabled{opacity:.35;cursor:not-allowed;}
.ci-send svg{width:15px;height:15px;fill:#fff;}

/* COMPLETION */
.done-card{background:var(--g50);border:1px solid #97C459;border-radius:var(--rlg);padding:16px;text-align:center;margin:4px 0;}
.done-icon{width:46px;height:46px;border-radius:50%;background:var(--g600);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.done-icon svg{width:24px;height:24px;fill:#fff;}
.done-title{font-size:15px;font-weight:600;color:var(--g600);margin-bottom:5px;}
.done-sub{font-size:12.5px;color:#3B6D11;line-height:1.55;}
.done-cta{display:block;margin-top:12px;padding:11px 20px;background:var(--g600);color:#fff;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;width:100%;transition:background .15s;}
.done-cta:hover{background:#27500A;}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:var(--p600);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(83,74,183,.45);z-index:999;transition:all .2s;opacity:0;pointer-events:none;}
.fab.show{opacity:1;pointer-events:all;}
.fab:hover{transform:scale(1.06);background:var(--p800);}
.fab svg{width:24px;height:24px;fill:#fff;}
.fab-badge{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}

@media(max-width:440px){.cw{width:calc(100vw - 16px);right:8px;bottom:8px;}}
</style>
</head>
<body>

<div class="demo-bg">
  <div class="demo-label">
    <h1>GCC School</h1>
    <p>My Account — Dashboard</p>
    <p style="margin-top:12px;font-size:12px;color:#bbb;">Aria chatbot opens in 2 seconds</p>
  </div>
</div>

<button class="fab" id="fab" aria-label="Open chat">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l5.07-1.34A9.93 9.93 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm-1 13H7v-2h4v2zm6 0h-4v-2h4v2zm0-4H7V9h10v2z"/></svg>
  <span class="fab-badge">1</span>
</button>

<div class="cw hide" id="cw" role="dialog" aria-label="GCC School Admissions Assistant">
  <div class="ch">
    <div class="ch-ava">
      <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 012 2c0 .74-.4 1.38-1 1.73V7h1a7 7 0 017 7H4a7 7 0 017-7h1V5.73A2 2 0 0112 2M9 9H7v2h2V9m6 0h-2v2h2V9M4 14h16v2a8 8 0 01-8 8 8 8 0 01-8-8v-2z"/></svg>
    </div>
    <div class="ch-info">
      <div class="ch-name">Aria — GCC School</div>
      <div class="ch-status"><span class="ch-dot"></span>Admissions assistant · Online</div>
    </div>
    <button class="ch-close" id="closeBtn" aria-label="Close">&#x2715;</button>
  </div>

  <div class="cp">
    <div class="cp-labels"><span>Profile completion</span><span class="cp-pct" id="pctLabel">13%</span></div>
    <div class="cp-track"><div class="cp-fill" id="pctBar"></div></div>
  </div>

  <div class="cb" id="cb"></div>

  <div class="ci">
    <input class="ci-txt" id="txtIn" placeholder="Type your reply..." disabled />
    <button class="ci-send" id="sendBtn" disabled aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ─── HELPERS ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const cb = $('cb'), txtIn = $('txtIn'), sendBtn = $('sendBtn');
const pctBar = $('pctBar'), pctLabel = $('pctLabel');
const cw = $('cw'), fab = $('fab');

const BOT_SVG = `<svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 012 2c0 .74-.4 1.38-1 1.73V7h1a7 7 0 017 7H4a7 7 0 017-7h1V5.73A2 2 0 0112 2M9 9H7v2h2V9m6 0h-2v2h2V9M4 14h16v2a8 8 0 01-8 8 8 8 0 01-8-8v-2z"/></svg>`;

function scroll() { setTimeout(() => { cb.scrollTop = cb.scrollHeight; }, 40); }

function botRow(html, isErr) {
  const r = document.createElement('div'); r.className = 'mr';
  const a = document.createElement('div'); a.className = 'mava' + (isErr ? ' err' : ''); a.innerHTML = BOT_SVG;
  const b = document.createElement('div'); b.className = 'bub ' + (isErr ? 'err' : 'bot'); b.innerHTML = html;
  r.appendChild(a); r.appendChild(b); cb.appendChild(r); scroll(); return b;
}

function userRow(text) {
  const r = document.createElement('div'); r.className = 'mr u';
  const b = document.createElement('div'); b.className = 'bub usr'; b.textContent = text;
  r.appendChild(b); cb.appendChild(r); scroll();
}

function divider(label) {
  const d = document.createElement('div'); d.className = 'sdiv';
  d.innerHTML = `<div class="sdiv-line"></div><div class="sdiv-label">${label}</div><div class="sdiv-line"></div>`;
  cb.appendChild(d); scroll();
}

function typing(delay, cb_fn) {
  const r = document.createElement('div'); r.className = 'typing-row'; r.id = 'typ';
  r.innerHTML = `<div class="mava">${BOT_SVG}</div><div class="typing-bub"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  cb.appendChild(r); scroll();
  return setTimeout(() => { const t = $('typ'); if(t) t.remove(); cb_fn(); }, delay);
}

function setProgress(v) {
  pctBar.style.width = v + '%';
  pctLabel.textContent = v + '%';
}

function enableInput(ph) {
  txtIn.disabled = false; sendBtn.disabled = false;
  txtIn.placeholder = ph || 'Type your reply...';
  txtIn.value = ''; txtIn.focus();
}

function disableInput() {
  txtIn.disabled = true; sendBtn.disabled = true;
  txtIn.placeholder = 'Type your reply...';
}

// ─── STATE ────────────────────────────────────────────────────────
const P = {
  first_name:'Akshay', last_name:'', dob:'', gender:'',
  guardian_name:'', guardian_rel:'', guardian_phone:'', guardian_email:'',
  emergency_name:'', emergency_phone:'',
  pin_code:'', address:'',
  c10_year:'', c10_grade_type:'', c10_score:'', c10_medium:'',
  c12_year:'', c12_grade_type:'', c12_score:'', c12_medium:'',
  ug_status:'', ug_score:'', ug_institution:'', ug_medium:'',
  hq:'', hq_name:'',
  emp_status:'', org:'', desig:'', func_area:'', work_from:'',
  aadhar:false, dob_proof:false, photo:false, sig:false, resume:false
};

let awaitField = null;   // {key, validate}
let retryCount = 0;
let queueLocked = false; // true while waiting for user input

// ─── VALIDATORS ───────────────────────────────────────────────────
const V = {
  any:   v => v.trim().length > 0,
  name:  v => v.trim().length >= 2,
  date:  v => /^\d{2}-\d{2}-\d{4}$/.test(v.trim()),
  phone: v => /^[6-9]\d{9}$/.test(v.replace(/\D/g,'')),
  email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()),
  pin:   v => /^\d{6}$/.test(v.trim()),
  year:  v => /^\d{4}$/.test(v.trim()) && +v >= 1990 && +v <= 2026,
  score: v => { const n=parseFloat(v); return !isNaN(n) && n>0 && n<=100; },
  text:  v => v.trim().length >= 2
};
const VERR = {
  name:'Please enter at least 2 characters.',
  date:'Please use DD-MM-YYYY format, e.g. 15-03-2001.',
  phone:'Please enter a valid 10-digit mobile number starting with 6–9.',
  email:'That email doesn\'t look right — please check.',
  pin:'Please enter a valid 6-digit PIN code.',
  year:'Please enter a valid year (1990–2026).',
  score:'Please enter a valid score, e.g. 85 or 8.5.',
  text:'Please enter at least 2 characters.'
};

// ─── STEP QUEUE ───────────────────────────────────────────────────
// Each step is a function. The queue runs one at a time.
// Steps that need user input call PAUSE() — queue resumes via RESUME().
const Q = [];
let running = false;

function push(...fns) { fns.forEach(f => Q.push(f)); if (!running && !queueLocked) run(); }
function run() {
  if (Q.length === 0) { running = false; return; }
  if (queueLocked) { running = false; return; }
  running = true;
  const fn = Q.shift();
  fn();
}
function next() { setTimeout(run, 60); }
function PAUSE() { queueLocked = true; running = false; }
function RESUME() { queueLocked = false; run(); }

// ─── STEP PRIMITIVES ──────────────────────────────────────────────
function SAY(text, delay) {
  return () => typing(delay||700, () => { botRow(text); next(); });
}

function DIVIDER(label) {
  return () => { divider(label); next(); };
}

function PROGRESS(v) {
  return () => { setProgress(v); next(); };
}

// Ask user to type. Saves to P[key]. Validates.
function ASK(question, key, validate, placeholder, delay) {
  return () => {
    typing(delay||700, () => {
      botRow(question);
      awaitField = { key, validate: validate||'any' };
      retryCount = 0;
      enableInput(placeholder || 'Type your reply...');
      PAUSE();
    });
  };
}

// Show quick-reply buttons. onChoose(label) callback saves & resumes.
function CHOOSE(question, options, onChoose, delay) {
  // options: [{label, value?}]
  return () => {
    typing(delay||700, () => {
      botRow(question);
      const wrap = document.createElement('div'); wrap.className = 'qr-wrap';
      options.forEach(opt => {
        const btn = document.createElement('button'); btn.className = 'qr-btn';
        btn.textContent = opt.label;
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.qr-btn').forEach(b => { b.classList.remove('sel'); b.disabled = true; });
          btn.classList.add('sel');
          userRow(opt.label);
          PAUSE(); // will be RESUME'd by onChoose
          onChoose(opt.value !== undefined ? opt.value : opt.label);
        });
        wrap.appendChild(btn);
      });
      cb.appendChild(wrap); scroll();
      PAUSE();
    });
  };
}

// File upload step
function UPLOAD(question, key, label, accept, delay) {
  return () => {
    typing(delay||600, () => {
      botRow(question);
      const wrap = document.createElement('div'); wrap.className = 'up-wrap';
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = accept; inp.className = 'up-inp';
      const btn = document.createElement('button'); btn.className = 'up-btn';
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>${label}`;
      btn.addEventListener('click', () => inp.click());
      inp.addEventListener('change', e => {
        const file = e.target.files[0]; if (!file) return;
        if (file.size > 2*1024*1024) {
          typing(400, () => { botRow('That file is over 2 MB. Please upload a smaller file and try again.', false); });
          inp.value = ''; return;
        }
        btn.disabled = true; inp.disabled = true;
        btn.style.opacity = '0.5';
        P[key] = true;
        userRow('📎 ' + file.name);
        typing(500, () => { botRow('Saved ✓'); RESUME(); });
      });
      wrap.appendChild(inp); wrap.appendChild(btn);
      cb.appendChild(wrap); scroll();
      PAUSE();
    });
  };
}

function DONE() {
  return () => {
    const card = document.createElement('div'); card.className = 'done-card';
    card.innerHTML = `
      <div class="done-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
      <div class="done-title">Profile 100% complete!</div>
      <div class="done-sub">Your NFET slot booking is now unlocked. Book your slot for June 17–20 before they fill up.</div>
      <button class="done-cta" onclick="alert('Redirecting to NFET slot booking...')">Book my NFET slot →</button>`;
    cb.appendChild(card); scroll();
    disableInput();
  };
}

// ─── TEXT SUBMIT ──────────────────────────────────────────────────
function handleSubmit() {
  if (!awaitField || queueLocked === false) return; // not waiting
  const val = txtIn.value.trim();
  if (!val) return;
  const { key, validate } = awaitField;
  const ok = V[validate] ? V[validate](val) : true;

  userRow(val);
  txtIn.value = '';

  if (!ok) {
    retryCount++;
    if (retryCount >= 2) {
      retryCount = 0;
      awaitField = null;
      disableInput();
      typing(600, () => {
        botRow('No problem — you can update this from your profile later. Moving on!');
        RESUME();
      });
    } else {
      typing(500, () => {
        botRow(VERR[validate] || 'Could you check that and try again?', true);
        enableInput(txtIn.placeholder); // re-enable for retry
      });
    }
    return;
  }

  retryCount = 0;
  P[key] = val;
  awaitField = null;
  disableInput();
  typing(400, () => { RESUME(); });
}

txtIn.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
sendBtn.addEventListener('click', handleSubmit);

// ─── WIDGET OPEN / CLOSE ──────────────────────────────────────────
function openWidget() { cw.classList.remove('hide'); fab.classList.remove('show'); }
function closeWidget() { cw.classList.add('hide'); fab.classList.add('show'); }
$('closeBtn').addEventListener('click', closeWidget);
fab.addEventListener('click', openWidget);

// ─── FULL CONVERSATION FLOW ───────────────────────────────────────
function buildFlow() {

  // ── GREETING ──
  push(
    SAY(`Hi ${P.first_name}! Welcome back to GCC School. 👋`, 600),
    SAY('Your NFET slot booking is almost ready — we just need a few details. It takes about 5 minutes.', 800),
    CHOOSE('Ready to complete your profile?',
      [{label:"Yes, let's go!"},{label:'Remind me in 10 min'}],
      choice => {
        if (choice === 'Remind me in 10 min') {
          push(
            SAY('No problem! I\'ll remind you in 10 minutes. Your progress is saved.', 600),
            () => { closeWidget(); setTimeout(() => { openWidget(); push(SAY('Hi again! Ready to complete your profile now?',500), ...greetingRepeat()); }, 600000); next(); }
          );
        } else {
          push(...section1());
        }
        RESUME();
      }
    )
  );
}

function greetingRepeat() {
  return [
    CHOOSE('Shall we finish your profile?',
      [{label:"Yes, let's go!"},{label:'Not now'}],
      c => { if(c !== 'Not now') push(...section1()); RESUME(); }
    )
  ];
}

// ── SECTION 1: PERSONAL ──────────────────────────────────────────
function section1() {
  return [
    DIVIDER('Section 1 of 4 — Personal information'),
    ASK('What is your last name?', 'last_name', 'name', 'e.g. Sharma'),
    ASK(()=>`Got it — ${P.first_name} ${P.last_name}! What is your date of birth? (DD-MM-YYYY)`, 'dob', 'date', 'e.g. 15-03-2001'),
    CHOOSE('What is your gender?',
      [{label:'Male'},{label:'Female'},{label:'Prefer not to say'}],
      v => { P.gender = v; push(...guardianQuestions()); RESUME(); }
    )
  ];
}

function guardianQuestions() {

function guardianContact() {

}

function addressQuestions() {

    ASK('Your complete address (area, city, state)?', 'address', 'text', 'House no., area, city, state'),

    UPLOAD('First, your Aadhar card:', 'aadhar', 'Attach Aadhar card', '.pdf,.jpg,.jpeg,.png'),
    UPLOAD('Proof of date of birth (marksheet or birth certificate):', 'dob_proof', 'Attach proof of DOB', '.pdf,.jpg,.jpeg,.png'),
    UPLOAD('A recent passport-size photograph:', 'photo', 'Attach photograph', '.jpg,.jpeg,.png'),
    UPLOAD('Your signature image:', 'sig', 'Attach signature', '.jpg,.jpeg,.png,.pdf'),
    UPLOAD('Finally, your resume:', 'resume', 'Attach resume', '.pdf,.doc,.docx'),
    PROGRESS(100),
    SAY(`All done, ${P.first_name}! Your profile is 100% complete. 🎉`, 500),
    DONE()
  ];
}

// ── PATCH: ASK supports function text ────────────────────────────
// Override ASK to support lazy text evaluation
const _ASK = ASK;
function ASK(textOrFn, key, validate, placeholder, delay) {
  return () => {
    const text = typeof textOrFn === 'function' ? textOrFn() : textOrFn;
    typing(delay||700, () => {
      botRow(text);
      awaitField = { key, validate: validate||'any' };
      retryCount = 0;
      enableInput(placeholder || 'Type your reply...');
      PAUSE();
    });
  };
}
