<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Accounting & Reporting (FAR) - Practice Test</title>
  <!-- Google Fonts for Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="./images/logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Test Container -->
  <div class="test-container">
    
    <!-- Header Block -->
    <header class="test-header">
      <div class="header-left">
        <!-- Digital Timer and Analog Clock Icon -->
        <div class="timer-wrapper">
          <div class="clock-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="timer-display-container">
            <span id="timer-display" class="timer-text">30:00</span>
            <span class="timer-label">Time Remaining</span>
          </div>
        </div>
      </div>
      
      <!-- Center Info / Test Title -->
      <div class="header-center">
        <h1 class="test-title">Financial Accounting & Reporting (FAR) - Practice Test</h1>
      </div>
      
      <!-- Right Controls -->
      <div class="header-right">
        <!-- Single Calculator Button -->
        <button id="calc-toggle-btn" class="icon-btn tool-btn" aria-label="Open Calculator">
          <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path>
          </svg>
          <span class="tool-text">Calculator</span>
        </button>

        <!-- Exit From Test Button -->
        <button id="exit-btn" class="exit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Exit From Test</span>
        </button>
      </div>
    </header>

    <!-- Progress Indicator Bar -->
    <nav class="progress-bar-container" aria-label="Question Navigation">
      <div class="progress-nav-list" id="progress-nav">
        <!-- Dynamically rendered -->
        <button class="nav-item active" data-id="1">1</button>
        <button class="nav-item" data-id="2">2</button>
        <button class="nav-item" data-id="3">3</button>
        <button class="nav-item" data-id="4">4</button>
        <button class="nav-item" data-id="5">5</button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Question Card Wrapper -->
      <div class="question-meta-row">
        <span class="question-tracker" id="question-tracker">Question 1 of 5 (#KCGFARCCE0001)</span>
      </div>

      <!-- Main Question Card -->
      <div class="question-card" id="question-card">
        <!-- Dynamic content goes here -->
        <div class="question-body">
          <p id="question-text" class="question-text">Loading question...</p>
        </div>
        
        <div class="options-container" id="options-container">
          <!-- Dynamic options will render here -->
        </div>

        <div class="card-footer">
          <button id="submit-btn" class="submit-btn" disabled>Submit</button>
        </div>
      </div>
      
    </main>
  </div>

  <!-- Calculator Modal Overlay -->
  <div id="calc-modal" class="modal-overlay hidden" aria-modal="true" role="dialog">
    <div class="calculator-modal">
      <div class="calc-header">
        <span class="calc-title">Calculator</span>
        <button id="calc-close-btn" class="calc-close-btn">Close</button>
      </div>
      
      <div class="calc-body">
        <!-- Display screen -->
        <div class="calc-screen">
          <div id="calc-history" class="calc-history"></div>
          <div id="calc-display" class="calc-display-val">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="calc-grid">
          <!-- Row 1: Memory functions -->
          <button class="calc-btn memory-btn" data-action="mc">MC</button>
          <button class="calc-btn memory-btn" data-action="mr">MR</button>
          <button class="calc-btn memory-btn" data-action="ms">MS</button>
          <button class="calc-btn memory-btn" data-action="m+">M+</button>
          <button class="calc-btn memory-btn" data-action="m-">M-</button>

          <!-- Row 2 -->
          <button class="calc-btn num-btn" data-val="7">7</button>
          <button class="calc-btn num-btn" data-val="8">8</button>
          <button class="calc-btn num-btn" data-val="9">9</button>
          <button class="calc-btn clear-btn" data-action="clear">AC</button>
          <button class="calc-btn backspace-btn" data-action="backspace" aria-label="Backspace">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>

          <!-- Row 3 -->
          <button class="calc-btn num-btn" data-val="4">4</button>
          <button class="calc-btn num-btn" data-val="5">5</button>
          <button class="calc-btn num-btn" data-val="6">6</button>
          <button class="calc-btn operator-btn" data-op="/">÷</button>
          <button class="calc-btn operator-btn" data-op="*">x</button>

          <!-- Row 4 -->
          <button class="calc-btn num-btn" data-val="1">1</button>
          <button class="calc-btn num-btn" data-val="2">2</button>
          <button class="calc-btn num-btn" data-val="3">3</button>
          <button class="calc-btn operator-btn" data-op="-">-</button>
          <button class="calc-btn operator-btn" data-op="+">+</button>

          <!-- Row 5 -->
          <button class="calc-btn toggle-sign-btn" data-action="negate">±</button>
          <button class="calc-btn num-btn" data-val="0">0</button>
          <button class="calc-btn num-btn" data-val=".">.</button>
          <button class="calc-btn percent-btn" data-action="percent">%</button>
          <button class="calc-btn equals-btn" data-action="equals">=</button>
        </div>
      </div>
    </div>
  </div>

  <!-- End of Test / Summary Modal -->
  <div id="summary-modal" class="modal-overlay hidden" aria-modal="true" role="dialog">
    <div class="summary-card">
      <div class="summary-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2>Practice Test Submitted!</h2>
      <p id="summary-message">Your responses have been successfully submitted to the server.</p>
      
      <div class="summary-details" id="summary-details">
        <!-- Dynamic summary elements -->
      </div>
      
      <div class="summary-actions">
        <button id="restart-btn" class="restart-btn">Start New Attempt</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
